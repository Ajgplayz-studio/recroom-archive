<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecRoom Archive</title>
    <style>
        :root {
            --bg-dark: #0b0c10;
            --bg-sidebar: #13151b;
            --bg-card: #1f212a;
            --text-main: #ffffff;
            --text-muted: #8b8d97;
            --accent: #6c5ce7;
            --accent-hover: #5b4bc4;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 250px;
            background-color: var(--bg-sidebar);
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2a2c35;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 30px;
            height: 30px;
            background-color: var(--accent);
            border-radius: 8px;
        }

        .nav-item {
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
            font-weight: 500;
        }

        .nav-item.active {
            background-color: var(--accent);
            color: white;
        }

        .nav-item:hover:not(.active) {
            background-color: #2a2c35;
            color: white;
        }

        /* Main Content Styling */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 600;
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #2a2c35;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 150px;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border-color: var(--accent);
        }

        .card-icon {
            width: 60px;
            height: 60px;
            background-color: #2a2c35;
            border-radius: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--accent);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* Modal (Popup) Styling */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            background-color: rgba(0, 0, 0, 0.75); 
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 450px;
            border: 1px solid #2a2c35;
            position: relative;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1;
        }

        .close-btn:hover {
            color: white;
        }

        .modal-content h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.5rem;
            text-align: center;
        }

        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .modal-buttons::-webkit-scrollbar {
            width: 6px;
        }
        .modal-buttons::-webkit-scrollbar-thumb {
            background-color: #2a2c35;
            border-radius: 10px;
        }

        .modal-link-btn {
            background-color: #2a2c35;
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: background-color 0.2s, transform 0.1s;
            display: block;
            text-align: left;
        }

        .modal-link-btn:hover {
            background-color: var(--accent);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <!-- Sidebar Menu -->
    <div class="sidebar">
        <div class="logo">
            <div class="logo-icon"></div>
            RecRoom Archive
        </div>
        <div class="nav-item active">Library</div>
        <div class="nav-item">Collections</div>
        <div class="nav-item">Settings</div>
    </div>

    <!-- Main Workspace -->
    <div class="main-content">
        <header>
            <h1>My Applications</h1>
        </header>

        <div class="grid">
            <!-- App 1: recroom.com -->
            <a href="https://ajgplayz-studio.github.io/recroom.com/Rec%20Room.com.html" class="card">
                <div class="card-icon">🌐</div>
                <div class="card-title">recroom.com</div>
            </a>
            
            <!-- App 2: rec.net (Triggers Modal) -->
            <div class="card" onclick="openModal()">
                <div class="card-icon">📂</div>
                <div class="card-title">rec.net</div>
            </div>
        </div>
    </div>

    <!-- The Popup Modal for rec.net -->
    <div id="recnetModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2>rec.net Archive Links</h2>
            <div class="modal-buttons">
                <!-- Links parsed from code.txt -->
                <a href="https://ajgplayz-studio.github.io/rec.net-archive/iquit%7B0PP%7D%5BPSV%5D%20%40AjgplayzAA6.html" class="modal-link-btn" target="_blank">ajgplayz</a>
                <a href="https://ajgplayz-studio.github.io/rec.net-archive/Veino%7B0PP%7D%5B!P%5D%20%40Jasperthe2cnd%20try1.html" class="modal-link-btn" target="_blank">jasperthe2cnd</a>
                <a href="https://ajgplayz-studio.github.io/rec.net-archive/Mr%20bob%20%40Mateothomas2020%20fixed.html" class="modal-link-btn" target="_blank">mr.bob</a>
                <a href="https://ajgplayz-studio.github.io/rec.net-archive/Maplz_%20%40Maplz_try3.html" class="modal-link-btn" target="_blank">Maplz</a>
                <a href="https://ajgplayz-studio.github.io/rec.net-archive/IMAN%7B0PP%7D%5BPSV%5D%20%40iman44.55%20try%201.html" class="modal-link-btn" target="_blank">IMAN</a>
                <a href="https://ajgplayz-studio.github.io/rec.net-archive/Greencatvr%20%40AGreenCatWasHere.html" class="modal-link-btn" target="_blank">greencatvr</a>
                <a href="https://ajgplayz-studio.github.io/rec.net-archive/ClearVR%20%40IAMELVIS08.html" class="modal-link-btn" target="_blank">clearvrgt</a>
                <a href="https://ajgplayz-studio.github.io/rec.net-archive/%23SAVERR%20%40Mrdadddyishere%20try2.html" class="modal-link-btn" target="_blank">ogjackvr</a>
                <a href="https://github.com/ajgplayz-studio/rec.net-archive" class="modal-link-btn" target="_blank">more</a>
            </div>
        </div>
    </div>

    <!-- Modal JavaScript functionality -->
    <script>
        const modal = document.getElementById("recnetModal");

        function openModal() {
            modal.style.display = "flex";
        }

        function closeModal() {
            modal.style.display = "none";
        }

        // Close the modal if the user clicks outside the modal content window
        window.onclick = function(event) {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
